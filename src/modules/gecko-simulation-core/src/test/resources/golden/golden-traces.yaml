# Release trace manifest. The acceptance contract belongs to issues #62 and #63.
# Paths below are relative to this manifest, unless stated otherwise.

# Where to place generated traces (relative to this file)
output_dir: "../traces/v202"

reference:
  release: "v2.02"
  source_commit: "b34b9b9d8110374097a1fc5839491e66cff5a39a"
  provenance: "observation-only instrumented v2.02 source capture"
  evidence_file: "../traces/v202/reference-acceptance.json"
  required_fresh_process_captures: 3
  stock_scope_witness_required: true
  signal_identity: "component and terminal connectivity, physical unit, reference, and direction"

comparison:
  enabled: false
  requires_user_absolute_tolerance_review: true
  absolute_tolerances_approved: false
  timestamp_absolute_tolerance_s: 1.0e-12
  binary_command_and_conduction_comparison: exact
  analog_rule: "abs(actual-reference) <= max(absolute_tolerance, 0.01*abs(reference))"
  proposed_absolute_tolerances:
    V: 6.0e-11
    A: 6.0e-11
    ohm: 4.0e-9

# Where .ipes source files live (relative to repo root)
ipes_source_dir: "src/test/resources/ipes/education"

# Where .ipes copies go for simulation-core module (relative to repo root)
ipes_target_dir: "src/modules/gecko-simulation-core/src/test/resources/ipes"

# Global defaults (can be overridden per circuit)
defaults:
  tolerance_percent: 1.0
  export_format: "csv.gz"        # gzipped CSV
  delimiter: ","
  scientific_notation: true
  precision: 12                  # Decimal places in scientific notation.
  time_step_s: 1.0e-6
  solver: backward-euler

# Circuit definitions
circuits:

  # ─── PWM Converters ───────────────────────────────────────────────

  - id: buckBoost_simple
    ipes_file: buckBoost_simple.ipes
    end_time_s: 0.001
    trace_files: {v202: "../traces/v202/buckBoost_simple_trace.csv.gz"}
    signal_schema: "../traces/v202/buckBoost_simple_schema.json"
    category: pwm_converter
    description: "Inverting buck-boost converter, |Vout| = D/(1-D) * Vin"
    expected_behavior:
      output_voltage: "-D/(1-D) * Vin (inverted)"
      operating_mode: CCM
    signals_of_interest:
      - "output voltage (capacitor node)"
      - "inductor current"
      - "switch node voltage"
    plecs_model: null              # To be created
    test_class: "BuckBoostApplicationTest"

  - id: cuk_simple
    ipes_file: cuk_simple.ipes
    end_time_s: 0.001
    trace_files: {v202: "../traces/v202/cuk_simple_trace.csv.gz"}
    signal_schema: "../traces/v202/cuk_simple_schema.json"
    category: pwm_converter
    description: "Cuk converter with input/output inductors"
    expected_behavior:
      output_voltage: "-D/(1-D) * Vin (inverted)"
      operating_mode: CCM
    signals_of_interest:
      - "output voltage"
      - "input inductor current"
      - "output inductor current"
      - "coupling capacitor voltage"
    plecs_model: null
    test_class: "CukApplicationTest"

  - id: sepic_simple
    ipes_file: sepic_simple.ipes
    end_time_s: 0.001
    trace_files: {v202: "../traces/v202/sepic_simple_trace.csv.gz"}
    signal_schema: "../traces/v202/sepic_simple_schema.json"
    category: pwm_converter
    description: "SEPIC converter, non-inverted output"
    expected_behavior:
      output_voltage: "D/(1-D) * Vin (positive)"
      operating_mode: CCM
    signals_of_interest:
      - "output voltage"
      - "input inductor current"
      - "output inductor current"
    plecs_model: null
    test_class: "SepicApplicationTest"

  - id: singlePhase_PWM_converter
    ipes_file: singlePhase_PWM_converter.ipes
    end_time_s: 0.02
    trace_files: {v202: "../traces/v202/singlePhase_PWM_converter_trace.csv.gz"}
    signal_schema: "../traces/v202/singlePhase_PWM_converter_schema.json"
    category: full_bridge
    description: "Single-phase H-bridge PWM inverter, DC→AC"
    expected_behavior:
      output_voltage: "AC waveform from DC input"
      modulation: PWM
    signals_of_interest:
      - "AC output voltage"
      - "output current"
      - "DC bus current"
    plecs_model: null
    test_class: "FullBridgePWMApplicationTest"

  # ─── Thyristor Circuits ───────────────────────────────────────────

  - id: thyristor_RL_single
    ipes_file: thyristor_RL_single.ipes
    end_time_s: 0.04
    trace_files: {v202: "../traces/v202/thyristor_RL_single_trace.csv.gz"}
    signal_schema: "../traces/v202/thyristor_RL_single_schema.json"
    category: thyristor
    description: "Single-phase thyristor rectifier with RL load"
    expected_behavior:
      output: "Phase-controlled half-wave rectification"
      key_behavior: "Gate timing controls average output voltage"
    signals_of_interest:
      - "load current"
      - "thyristor voltage"
      - "output voltage"
    plecs_model: null
    test_class: "ThyristorRLApplicationTest"

  - id: thyristor_freeWheelingDiode
    ipes_file: thyristor_freeWheelingDiode.ipes
    end_time_s: 0.04
    trace_files: {v202: "../traces/v202/thyristor_freeWheelingDiode_trace.csv.gz"}
    signal_schema: "../traces/v202/thyristor_freeWheelingDiode_schema.json"
    category: thyristor
    description: "Thyristor rectifier with freewheeling diode"
    expected_behavior:
      output: "Improved current waveform vs. plain thyristor"
      key_behavior: "Freewheeling diode provides current path during off period"
    signals_of_interest:
      - "load current"
      - "thyristor current"
      - "freewheeling diode current"
    plecs_model: null
    test_class: "ThyristorFWDApplicationTest"

  # ─── Diode Circuits ──────────────────────────────────────────────

  - id: 2phaseDiodeBridge_AC-Inductor
    ipes_file: 2phaseDiodeBridge_AC-Inductor.ipes
    end_time_s: 0.04
    trace_files: {v202: "../traces/v202/2phaseDiodeBridge_AC-Inductor_trace.csv.gz"}
    signal_schema: "../traces/v202/2phaseDiodeBridge_AC-Inductor_schema.json"
    category: diode_bridge
    description: "2-phase diode bridge rectifier with AC-side inductor"
    expected_behavior:
      output: "DC voltage from 2-phase AC input"
      key_behavior: "Inductor smooths commutation"
    signals_of_interest:
      - "DC output voltage"
      - "DC output current"
      - "AC input current"
    plecs_model: null
    test_class: "DiodeBridgeApplicationTest"

  - id: diode_RL_singlePH_trafo
    ipes_file: diode_RL_singlePH_trafo.ipes
    end_time_s: 0.06
    trace_files: {v202: "../traces/v202/diode_RL_singlePH_trafo_trace.csv.gz"}
    signal_schema: "../traces/v202/diode_RL_singlePH_trafo_schema.json"
    category: diode_rectifier
    description: "Single-phase diode bridge with transformer and RL load"
    expected_behavior:
      output: "Full-wave rectified DC"
      key_behavior: "Transformer isolation + rectification"
    signals_of_interest:
      - "DC output voltage"
      - "load current"
      - "transformer primary current"
    plecs_model: null
    test_class: "DiodeRectifierApplicationTest"

  # Existing development baselines remain separate from release captures.

  - id: buck_simple
    ipes_file: buck_simple.ipes
    category: pwm_converter
    description: "Basic buck converter, Vout = D * Vin"
    end_time_s: 0.001
    signal_schema: "../traces/v202/buck_simple_schema.json"
    trace_files:
      v202: "../traces/v202/buck_simple_trace.csv.gz"
      legacy: "../traces/buck_simple_trace.csv.gz"
    test_class: "BuckSimpleApplicationTest"

  - id: boost_simple
    ipes_file: boost_simple.ipes
    category: pwm_converter
    description: "Basic boost converter, Vout = Vin / (1-D)"
    end_time_s: 0.001
    signal_schema: "../traces/v202/boost_simple_schema.json"
    trace_files:
      v202: "../traces/v202/boost_simple_trace.csv.gz"
      legacy: "../traces/boost_simple_trace.csv.gz"
    test_class: "BoostSimpleApplicationTest"
