# Golden Trace Generation Configuration
# =======================================
# Defines circuits and parameters for generating per-step golden trace CSVs.
# Used by: GeckoCIRCUITS v2.02, PLECS, and future tools.
#
# File naming: <circuit_id>_<tool>.csv  (e.g., buckBoost_simple_v202.csv)
# Trace format: gzipped CSV with header row:
#   time,p[0],p[1],...,p[N],i[0],i[1],...,i[M],R_sw_<name>,gate_<name>,R_d_<name>
#
# Tools:
#   v202  — GeckoCIRCUITS v2.02 (reference baseline)
#   plecs — PLECS (cross-tool validation)
#   v300  — GeckoCIRCUITS v3.x headless engine (generated by tests)

# Where to place generated traces (relative to this file)
output_dir: "."

# Where .ipes source files live (relative to repo root)
ipes_source_dir: "src/test/resources/ipes/education"

# Where .ipes copies go for simulation-core module (relative to repo root)
ipes_target_dir: "src/modules/gecko-simulation-core/src/test/resources/ipes"

# Global defaults (can be overridden per circuit)
defaults:
  tolerance_percent: 1.0
  export_format: "csv.gz"        # gzipped CSV
  delimiter: ","
  scientific_notation: true
  precision: 12                  # significant digits in scientific notation

# Circuit definitions
circuits:

  # ─── PWM Converters ───────────────────────────────────────────────

  - id: buckBoost_simple
    ipes_file: buckBoost_simple.ipes
    category: pwm_converter
    description: "Inverting buck-boost converter, |Vout| = D/(1-D) * Vin"
    expected_behavior:
      output_voltage: "-D/(1-D) * Vin (inverted)"
      operating_mode: CCM
    signals_of_interest:
      - "output voltage (capacitor node)"
      - "inductor current"
      - "switch node voltage"
    plecs_model: null              # To be created
    test_class: "BuckBoostApplicationTest"

  - id: cuk_simple
    ipes_file: cuk_simple.ipes
    category: pwm_converter
    description: "Cuk converter with input/output inductors"
    expected_behavior:
      output_voltage: "-D/(1-D) * Vin (inverted)"
      operating_mode: CCM
    signals_of_interest:
      - "output voltage"
      - "input inductor current"
      - "output inductor current"
      - "coupling capacitor voltage"
    plecs_model: null
    test_class: "CukApplicationTest"

  - id: sepic_simple
    ipes_file: sepic_simple.ipes
    category: pwm_converter
    description: "SEPIC converter, non-inverted output"
    expected_behavior:
      output_voltage: "D/(1-D) * Vin (positive)"
      operating_mode: CCM
    signals_of_interest:
      - "output voltage"
      - "input inductor current"
      - "output inductor current"
    plecs_model: null
    test_class: "SepicApplicationTest"

  - id: singlePhase_PWM_converter
    ipes_file: singlePhase_PWM_converter.ipes
    category: full_bridge
    description: "Single-phase H-bridge PWM inverter, DC→AC"
    expected_behavior:
      output_voltage: "AC waveform from DC input"
      modulation: PWM
    signals_of_interest:
      - "AC output voltage"
      - "output current"
      - "DC bus current"
    plecs_model: null
    test_class: "FullBridgePWMApplicationTest"

  # ─── Thyristor Circuits ───────────────────────────────────────────

  - id: thyristor_RL_single
    ipes_file: thyristor_RL_single.ipes
    category: thyristor
    description: "Single-phase thyristor rectifier with RL load"
    expected_behavior:
      output: "Phase-controlled half-wave rectification"
      key_behavior: "Gate timing controls average output voltage"
    signals_of_interest:
      - "load current"
      - "thyristor voltage"
      - "output voltage"
    plecs_model: null
    test_class: "ThyristorRLApplicationTest"

  - id: thyristor_freeWheelingDiode
    ipes_file: thyristor_freeWheelingDiode.ipes
    category: thyristor
    description: "Thyristor rectifier with freewheeling diode"
    expected_behavior:
      output: "Improved current waveform vs. plain thyristor"
      key_behavior: "Freewheeling diode provides current path during off period"
    signals_of_interest:
      - "load current"
      - "thyristor current"
      - "freewheeling diode current"
    plecs_model: null
    test_class: "ThyristorFWDApplicationTest"

  # ─── Diode Circuits ──────────────────────────────────────────────

  - id: 2phaseDiodeBridge_AC-Inductor
    ipes_file: 2phaseDiodeBridge_AC-Inductor.ipes
    category: diode_bridge
    description: "2-phase diode bridge rectifier with AC-side inductor"
    expected_behavior:
      output: "DC voltage from 2-phase AC input"
      key_behavior: "Inductor smooths commutation"
    signals_of_interest:
      - "DC output voltage"
      - "DC output current"
      - "AC input current"
    plecs_model: null
    test_class: "DiodeBridgeApplicationTest"

  - id: diode_RL_singlePH_trafo
    ipes_file: diode_RL_singlePH_trafo.ipes
    category: diode_rectifier
    description: "Single-phase diode bridge with transformer and RL load"
    expected_behavior:
      output: "Full-wave rectified DC"
      key_behavior: "Transformer isolation + rectification"
    signals_of_interest:
      - "DC output voltage"
      - "load current"
      - "transformer primary current"
    plecs_model: null
    test_class: "DiodeRectifierApplicationTest"

  # ─── Already completed (for reference) ───────────────────────────

  - id: buck_simple
    ipes_file: buck_simple.ipes
    category: pwm_converter
    description: "Basic buck converter, Vout = D * Vin"
    status: done
    trace_files:
      v202: "../../traces/buck_simple_trace.csv.gz"
    test_class: "BuckSimpleApplicationTest"

  - id: boost_simple
    ipes_file: boost_simple.ipes
    category: pwm_converter
    description: "Basic boost converter, Vout = Vin / (1-D)"
    status: done
    trace_files:
      v202: "../../traces/boost_simple_trace.csv.gz"
    test_class: "BoostSimpleApplicationTest"
