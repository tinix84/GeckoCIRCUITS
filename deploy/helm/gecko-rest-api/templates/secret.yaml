{{- if and (or .Values.auth.enabled .Values.auth.jwtEnabled) (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gecko-rest-api.secretName" . }}
type: Opaque
stringData:
  GECKO_API_KEYS: {{ required "Set auth.keys or auth.existingSecret." .Values.auth.keys | quote }}
  {{- if .Values.auth.jwtEnabled }}
  GECKO_API_JWT_SECRET: {{ required "Set auth.jwtSecret or auth.existingSecret." .Values.auth.jwtSecret | quote }}
  {{- end }}
{{- end }}
